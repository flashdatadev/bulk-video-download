name: Python bulk workflows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install minimum SDK from its verified release
        run: python -m pip install "https://github.com/flashdatadev/flashdata-python/releases/download/v1.3.0/flashdata-1.3.0-py3-none-any.whl#sha256=c28fc56a1ea11e930b313bb355792ebcd8c29d8d38d0ffd5d4b5a79e38c6b870"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m bulk_video_download demo
      - run: python -m bulk_video_download demo
      - run: python -m build
      - run: python -m twine check dist/*
