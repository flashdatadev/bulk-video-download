[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdata-bulk-video-download"
version = "0.1.0"
description = "Bulk video download with Python: YouTube ID files, cloud delivery, saved jobs and failed-only retries"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "FlashData", email = "support@flashdata.dev"}]
dependencies = ["flashdata>=1.2.0,<2"]
keywords = ["bulk-video-download", "bulk-youtube-download", "batch-download", "youtube", "python", "video-dataset"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2", "twine>=6,<7"]

[project.scripts]
flashdata-bulk = "bulk_video_download.cli:main"

[project.urls]
Homepage = "https://github.com/flashdatadev/bulk-video-download"
Documentation = "https://flashdata.dev/docs/sources/youtube_download"
Issues = "https://github.com/flashdatadev/bulk-video-download/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
